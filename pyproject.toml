[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llokim"
version = "0.1.0"
description = "A lightweight local Linux diagnostic and log intelligence utility"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Jaakko Tuokkola" }
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
llokim = "llokim.cli:main"
llokim-benchmark = "llokim.benchmark:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
